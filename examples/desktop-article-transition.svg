<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Renaissance Rococo editorial website concept</title>
  <desc id="desc">A desktop article transition from a pictorial scene through a torn mineral-green paper boundary into a calm reading surface.</desc>
  <defs>
    <linearGradient id="scene" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#142724"/>
      <stop offset=".58" stop-color="#485448"/>
      <stop offset="1" stop-color="#171a18"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8d7be"/>
      <stop offset="1" stop-color="#eee9dc"/>
    </linearGradient>
    <radialGradient id="light">
      <stop offset="0" stop-color="#f3dfb4" stop-opacity=".64"/>
      <stop offset="1" stop-color="#f3dfb4" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0a100e" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="#e7e0d1"/>
  <rect x="40" y="38" width="1520" height="924" rx="4" fill="#111917" filter="url(#shadow)"/>
  <rect x="40" y="38" width="1520" height="525" fill="url(#scene)"/>
  <ellipse cx="834" cy="225" rx="430" ry="205" fill="url(#light)"/>
  <path d="M40 405C240 347 319 269 476 278c153 9 216 75 382 43 190-36 282-174 457-163 108 7 190 47 245 89v316H40Z" fill="#26382f"/>
  <path d="M40 493c185-52 320-45 472-96 190-64 296-5 455-51 216-63 369-27 593 92v125H40Z" fill="#111d1b"/>
  <g transform="translate(727 111)">
    <path d="M98 314c-18-70-9-120 20-165 19-30 28-53 24-79 34 7 57 28 70 58 22 50 22 123 2 186Z" fill="#9b685f"/>
    <path d="M119 150c17-32 36-44 62-40 31 5 43 33 36 65-8 36-37 48-65 34-28-14-44-38-33-59Z" fill="#dab89d"/>
    <path d="M131 127c13-37 49-54 80-34 17 11 25 28 21 47-36-21-70-12-113 10Z" fill="#49322e"/>
    <path d="M210 243c73-18 128-57 184-107" fill="none" stroke="#dab89d" stroke-width="18" stroke-linecap="round"/>
    <circle cx="398" cy="132" r="11" fill="#dab89d"/>
    <path d="M96 313c-17 30-29 58-35 91h196c-10-34-24-65-43-91Z" fill="#6d8275"/>
    <path d="M98 312c41 24 81 25 116 0" fill="none" stroke="#d9c19d" stroke-width="4" opacity=".7"/>
  </g>
  <g fill="#eee7d3" font-family="Georgia,serif">
    <text x="92" y="98" font-size="17" letter-spacing="4">APRDE / PRIVATE ARCHIVE</text>
    <text x="92" y="170" font-size="64">The Cabinet of</text>
    <text x="92" y="234" font-size="64" font-style="italic">Memory &amp; Form</text>
  </g>
  <g fill="#dbcba9" font-family="Arial,sans-serif" font-size="14" letter-spacing="3">
    <text x="1282" y="98">WRITING</text>
    <text x="1403" y="98">ART</text>
    <text x="1480" y="98">ABOUT</text>
  </g>
  <g stroke="#e5cea1" fill="none" stroke-width="2" opacity=".82">
    <path d="M122 311c40-39 66 4 97-30 31-33 53-1 77-36"/>
    <path d="M126 313c27 6 50 32 77 16 28-16 47-1 62 21"/>
  </g>
  <path d="M40 529c82-19 138 14 211-3 78-18 122 22 200-2 84-25 140 16 220 1 85-16 143 23 231-2 84-23 156 21 237-3 90-26 165 26 248 2 70-20 127 10 173-4v183c-115 18-205-14-298 8-93 22-191-14-280 8-94 23-176-16-266 6-98 24-180-18-275 2-97 20-169-15-261 3-57 11-103 2-140-6Z" fill="#809386"/>
