  <g font-family="Arial,sans-serif" fill="#4c5a52">
    <text x="93" y="749" font-size="14" letter-spacing="3">ESSAY / 03</text>
    <line x1="93" y1="770" x2="300" y2="770" stroke="#7b897f"/>
    <text x="93" y="807" font-size="13" letter-spacing="2">CONTENTS</text>
    <text x="93" y="843" font-size="14">I. The retained image</text>
    <text x="93" y="872" font-size="14">II. Gesture and distance</text>
    <text x="93" y="901" font-size="14">III. After the scene</text>
  </g>
  <g fill="#252925">
    <text x="426" y="760" font-family="Georgia,serif" font-size="58">观看、时间与记忆</text>
    <text x="430" y="803" font-family="Arial,sans-serif" font-size="14" letter-spacing="2">ON LOOKING, TIME, AND MEMORY</text>
    <line x1="430" y1="831" x2="1120" y2="831" stroke="#999b8c"/>
    <text x="430" y="870" font-family="serif" font-size="19">当图像从入口的戏剧性空间退去，阅读并没有突然开始。</text>
    <text x="430" y="904" font-family="serif" font-size="19">边缘、色彩与目光仍留在纸面上，成为正文里的低声回响。</text>
  </g>
  <g transform="translate(1335 755)" fill="none" stroke="#4f665a" stroke-width="2">
